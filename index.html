<!doctype html>
<html lang="pl"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Nasz dom</title>
<style>
:root{
  --bg:#edf2ff;
  --fg:#172033;
  --mut:#69758c;
  --card:rgba(255,255,255,.58);
  --line:rgba(255,255,255,.78);
  --acc:#635bff;
  --done:#9aa4b5;
  --shadow:0 18px 48px rgba(43,58,101,.12);
  --soft-shadow:0 8px 24px rgba(43,58,101,.08);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#0a1020;
    --fg:#edf2ff;
    --mut:#9aa7bf;
    --card:rgba(24,33,54,.64);
    --line:rgba(255,255,255,.12);
    --acc:#958dff;
    --done:#6f7b91;
    --shadow:0 20px 54px rgba(0,0,0,.26);
    --soft-shadow:0 8px 24px rgba(0,0,0,.18);
    color-scheme:dark;
  }
}
*{box-sizing:border-box}
html,body{min-height:100%;}
html{background:var(--bg)}
body{
  margin:0;
  min-height:100vh;
  overflow-x:hidden;
  background:
    radial-gradient(ellipse at 12% 8%,rgba(135,160,255,.30),transparent 36%),
    radial-gradient(ellipse at 92% 18%,rgba(204,155,255,.24),transparent 32%),
    radial-gradient(ellipse at 52% 100%,rgba(119,211,224,.20),transparent 40%),
    var(--bg);
  background-attachment:fixed;
  color:var(--fg);
  font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  -webkit-font-smoothing:antialiased;
}
body::before,body::after{
  content:"";
  position:fixed;
  z-index:-1;
  width:260px;
  height:260px;
  border-radius:50%;
  filter:blur(70px);
  opacity:.42;
  pointer-events:none;
}
body::before{top:16%;left:-150px;background:#9bb8ff}
body::after{right:-150px;bottom:8%;background:#d3a7ff}
main{position:relative;max-width:620px;margin:0 auto;padding:34px 18px 42px}
h1{
  margin:0 0 22px;
  font-size:clamp(25px,5vw,31px);
  font-weight:760;
  letter-spacing:-.045em;
  line-height:1.2;
}
.tabs{
  display:flex;
  gap:5px;
  margin-bottom:20px;
  padding:6px;
  border:1px solid var(--line);
  border-radius:17px;
  background:var(--card);
  box-shadow:var(--soft-shadow);
  -webkit-backdrop-filter:blur(22px) saturate(150%);
  backdrop-filter:blur(22px) saturate(150%);
}
.tab{
  flex:1;
  min-width:0;
  padding:10px 8px;
  border:1px solid transparent;
  border-radius:12px;
  background:transparent;
  color:var(--mut);
  font-family:inherit;
  font-size:13px;
  font-weight:650;
  cursor:pointer;
  text-align:center;
  transition:background .2s ease,color .2s ease,transform .2s ease,box-shadow .2s ease;
}
.tab:hover{color:var(--fg);background:rgba(255,255,255,.28)}
.tab.active{
  color:#fff;
  border-color:transparent;
  background:linear-gradient(135deg,#746cff,#5d6bea 60%,#6d83f7);
  box-shadow:0 5px 14px rgba(95,101,230,.28),inset 0 1px 0 rgba(255,255,255,.24);
}
.panel{display:none}.panel.active{display:block;animation:panel-in .22s ease-out}
@keyframes panel-in{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:translateY(0)}}
.row{display:flex;align-items:stretch;gap:9px;margin-bottom:13px}
input[type=text],input[type=date]{
  min-width:0;
  padding:12px 14px;
  border:1px solid var(--line);
  border-radius:13px;
  outline:none;
  background:rgba(255,255,255,.46);
  color:var(--fg);
  font:inherit;
  box-shadow:inset 0 1px 1px rgba(255,255,255,.18);
  -webkit-backdrop-filter:blur(14px);
  backdrop-filter:blur(14px);
  transition:border-color .18s ease,box-shadow .18s ease,background .18s ease;
}
@media (prefers-color-scheme:dark){input[type=text],input[type=date]{background:rgba(255,255,255,.045)}}
input[type=text]{flex:1;width:100%}
input::placeholder{color:var(--mut);opacity:.78}
input[type=text]:focus,input[type=date]:focus{border-color:color-mix(in srgb,var(--acc) 70%,transparent);box-shadow:0 0 0 4px color-mix(in srgb,var(--acc) 14%,transparent)}
button{ -webkit-tap-highlight-color:transparent }
button.add{
  flex-shrink:0;
  padding:11px 17px;
  border:1px solid rgba(255,255,255,.22);
  border-radius:13px;
  background:linear-gradient(135deg,#746cff,#5d6bea 58%,#6d83f7);
  color:#fff;
  font-family:inherit;
  font-size:14px;
  font-weight:650;
  cursor:pointer;
  box-shadow:0 7px 16px rgba(95,101,230,.22),inset 0 1px 0 rgba(255,255,255,.25);
  transition:transform .18s ease,box-shadow .18s ease,filter .18s ease;
}
button.add:hover{filter:brightness(1.04);box-shadow:0 9px 20px rgba(95,101,230,.28),inset 0 1px 0 rgba(255,255,255,.25)}
button.add:active{transform:translateY(1px) scale(.99)}
ul{
  list-style:none;
  margin:0;
  padding:4px 12px;
  background:var(--card);
  border:1px solid var(--line);
  border-radius:17px;
  overflow:hidden;
  box-shadow:var(--shadow);
  -webkit-backdrop-filter:blur(24px) saturate(145%);
  backdrop-filter:blur(24px) saturate(145%);
}
li{display:flex;align-items:center;gap:11px;padding:13px 2px;border-bottom:1px solid color-mix(in srgb,var(--line) 72%,transparent)}
li:last-child{border-bottom:0}
li input[type=checkbox]{width:18px;height:18px;flex-shrink:0;accent-color:var(--acc);cursor:pointer}
.txt{flex:1;min-width:0}
.name{word-break:break-word;font-weight:550}
.done .name{text-decoration:line-through;color:var(--done)}
.by{font-size:12px;color:var(--mut);margin-top:2px}
.del{border:0;background:transparent;color:var(--mut);cursor:pointer;font-size:17px;line-height:1;padding:7px 8px;border-radius:9px;transition:background .18s ease,color .18s ease}
.del:hover{color:#e24e66;background:rgba(226,78,102,.10)}
.empty{color:var(--mut);text-align:center;padding:24px 16px;font-size:14px}
.foot{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:13px;padding:0 3px;font-size:12px;color:var(--mut)}
.foot button{font:inherit;font-weight:650;background:none;border:0;color:var(--acc);cursor:pointer;padding:5px 0}
.foot button:hover{text-decoration:underline}
.soon{background:var(--card);border:1px dashed var(--line);border-radius:16px;padding:30px 16px;text-align:center;color:var(--mut);box-shadow:var(--soft-shadow);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px)}
.soon b{display:block;color:var(--fg);font-size:17px;margin-bottom:4px}
#err{color:#dc3545;text-align:center;padding:13px 15px;margin:0 0 14px;border:1px solid rgba(220,53,69,.2);border-radius:14px;background:rgba(220,53,69,.08);display:none}
.when{font-size:12px;color:var(--mut)}
.recur{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--mut);white-space:nowrap;padding:0 3px}
.recur input{accent-color:var(--acc)}
.badge{font-size:11px;font-weight:700;padding:4px 9px;border-radius:999px;background:linear-gradient(135deg,#746cff,#5d6bea);color:#fff;white-space:nowrap;box-shadow:0 3px 9px rgba(95,101,230,.16)}
.badge.today{background:linear-gradient(135deg,#fb7185,#e54863);box-shadow:0 3px 9px rgba(229,72,99,.16)}
li.soonrow{background:color-mix(in srgb,var(--acc) 7%,transparent)}
.sug{position:absolute;top:calc(100% - 8px);left:0;right:0;background:color-mix(in srgb,var(--bg) 68%,white 32%);border:1px solid var(--line);border-radius:14px;margin-top:4px;max-height:280px;overflow-y:auto;z-index:5;display:none;box-shadow:var(--shadow);-webkit-backdrop-filter:blur(25px) saturate(150%);backdrop-filter:blur(25px) saturate(150%)}
@media (prefers-color-scheme:dark){.sug{background:rgba(22,30,49,.94)}}
.sug.show{display:block}
.sug-item{display:flex;gap:10px;align-items:center;padding:9px 11px;cursor:pointer;transition:background .15s ease}
.sug-item:hover{background:color-mix(in srgb,var(--acc) 10%,transparent)}
.sug-item img{width:36px;height:52px;object-fit:cover;border-radius:7px;background:var(--line);flex-shrink:0}
.sug-item .y{color:var(--mut);font-size:12px;margin-top:2px}
.wgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:13px}
.wcard{min-width:0;background:var(--card);border:1px solid var(--line);border-radius:15px;overflow:hidden;box-shadow:var(--soft-shadow);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);transition:transform .2s ease,box-shadow .2s ease,border-color .2s ease}
.wcard:hover{transform:translateY(-2px);box-shadow:var(--shadow);border-color:color-mix(in srgb,var(--acc) 24%,var(--line))}
.wcard img{width:100%;aspect-ratio:2/3;object-fit:cover;display:block;background:var(--line)}
.wcard .ph{width:100%;aspect-ratio:2/3;display:flex;align-items:center;justify-content:center;background:linear-gradient(145deg,rgba(124,141,255,.16),rgba(202,168,255,.18));color:var(--mut);font-size:30px}
.wcard .wt{padding:9px 9px 1px;font-size:13px;line-height:1.35;font-weight:600;word-break:break-word}
.wcard .wy{padding:2px 9px 8px;font-size:11px;color:var(--mut)}
.wcard.done{opacity:.55}
.wcard.done .wt{text-decoration:line-through}
.wbtns{display:flex;justify-content:space-between;gap:5px;padding:0 8px 9px}
.wbtns button{font:inherit;font-size:11px;font-weight:600;padding:5px 7px;border-radius:8px;border:1px solid var(--line);background:rgba(255,255,255,.26);color:var(--fg);cursor:pointer;transition:background .18s ease,border-color .18s ease}
@media (prefers-color-scheme:dark){.wbtns button{background:rgba(255,255,255,.04)}}
.wbtns button:hover{background:color-mix(in srgb,var(--acc) 10%,var(--card));border-color:color-mix(in srgb,var(--acc) 34%,var(--line))}
.wbtns button.del{color:#dc3545}
:focus-visible{outline:3px solid color-mix(in srgb,var(--acc) 58%,transparent);outline-offset:3px}
@media(max-width:480px){
  main{padding:25px 13px 32px}
  h1{margin-bottom:18px}
  .tabs{margin-bottom:17px;padding:5px;border-radius:15px}
  .tab{padding:10px 4px;font-size:12px;letter-spacing:-.01em}
  .row{gap:7px}
  input[type=text],input[type=date]{padding:11px 11px;border-radius:12px;font-size:14px}
  button.add{padding:10px 13px;border-radius:12px}
  .wgrid{grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:10px}
  .foot{align-items:flex-start}
  .recur{gap:4px;padding:0;font-size:11px}
  #p-cal .row:nth-of-type(2){flex-wrap:wrap}
  #calDate{flex:1 1 145px}
}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important;scroll-behavior:auto!important}}
</style></head>
<body><main>
<h1>🏡 Nasz dom</h1>
<div class="tabs">
 <button class="tab active" data-p="shop">Zakupy</button>
 <button class="tab" data-p="watch">Do obejrzenia</button>
 <button class="tab" data-p="cal">Kalendarz</button>
</div>
<div id="err"></div>
<div class="panel active" id="p-shop">
 <div class="row"><input id="shopInput" type="text" placeholder="np. mleko, chleb…" maxlength="80"><button class="add" id="shopAdd">Dodaj</button></div>
 <ul id="shopList"></ul>
 <div class="empty" id="shopEmpty" style="display:none">Lista jest pusta — dodaj coś powyżej.</div>
 <div class="foot"><span id="shopCount"></span><button id="shopClear">Wyczyść odhaczone</button></div>
</div>
<div class="panel" id="p-watch">
 <div class="row" style="position:relative">
  <input id="watchInput" type="text" placeholder="Wpisz tytuł filmu lub serialu…" maxlength="100" autocomplete="off">
  <div class="sug" id="watchSug"></div>
 </div>
 <div class="wgrid" id="watchGrid"></div>
 <div class="empty" id="watchEmpty" style="display:none">Lista jest pusta — zacznij wpisywać tytuł powyżej.</div>
</div>
<div class="panel" id="p-cal">
 <div class="row"><input id="calLabel" type="text" placeholder="np. Urodziny Zosi" maxlength="60"></div>
 <div class="row">
  <input id="calDate" type="date">
  <label class="recur"><input id="calRecurring" type="checkbox" checked> co roku</label>
  <button class="add" id="calAdd">Dodaj</button>
 </div>
 <ul id="calList"></ul>
 <div class="empty" id="calEmpty" style="display:none">Brak zapisanych dat — dodaj coś powyżej.</div>
</div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.108.2/dist/umd/supabase.js"></script>
<script>
// --- WKLEJ TU SWOJE DANE Z SUPABASE (Settings -> API Keys) ---
const SUPABASE_URL = "https://eiyuqczdtmuhjkqqqvva.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_dG2dAFFXU9Z_sEy56JDX2w_9aeV1GXE";
const TMDB_API_KEY = "8ffd14e25be9f06ce89a5ce352294c40";
// ------------------------------------------------------------------

const $=id=>document.getElementById(id);
document.querySelectorAll(".tab").forEach(t=>t.onclick=()=>{
  document.querySelectorAll(".tab").forEach(x=>x.classList.toggle("active",x===t));
  document.querySelectorAll(".panel").forEach(p=>p.classList.toggle("active",p.id==="p-"+t.dataset.p));
});

function myName(){
  let n=localStorage.getItem("nd_name");
  if(!n){n=(prompt("Jak Cię zapisać na liście? (imię)")||"Ktoś").trim().slice(0,30);localStorage.setItem("nd_name",n)}
  return n;
}

if(SUPABASE_URL.includes("TWOJ-PROJEKT")){
  $("err").style.display="block";
  $("err").textContent="Uzupełnij SUPABASE_URL i SUPABASE_ANON_KEY na górze pliku index.html.";
}else{
  const sb=supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  let items=[];

  function render(){
    const list=$("shopList");list.replaceChildren();
    $("shopEmpty").style.display=items.length?"none":"block";
    const left=items.filter(i=>!i.done).length;
    $("shopCount").textContent=items.length?(left+" do kupienia z "+items.length):"";
    for(const d of items){
      const li=document.createElement("li");
      if(d.done)li.classList.add("done");
      const cb=document.createElement("input");cb.type="checkbox";cb.checked=!!d.done;
      cb.onchange=async()=>{
        const {error}=await sb.from("shopping_items").update({done:cb.checked}).eq("id",d.id);
        if(error){cb.checked=!cb.checked;alert("Nie udało się zapisać: "+error.message)}
        load();
      };
      const txt=document.createElement("div");txt.className="txt";
      const nm=document.createElement("div");nm.className="name";nm.textContent=d.name||"";
      txt.append(nm);
      if(d.added_by){const by=document.createElement("div");by.className="by";by.textContent="dodał(a): "+d.added_by;txt.append(by)}
      const del=document.createElement("button");del.className="del";del.textContent="✕";
      del.onclick=async()=>{
        const {error}=await sb.from("shopping_items").delete().eq("id",d.id);
        if(error)alert("Nie udało się usunąć: "+error.message);
        load();
      };
      li.append(cb,txt,del);list.append(li);
    }
  }

  async function load(){
    const {data,error}=await sb.from("shopping_items").select("*").order("created_at",{ascending:true});
    if(error){$("err").style.display="block";$("err").textContent="Błąd połączenia z bazą: "+error.message;return}
    $("err").style.display="none";
    items=data;render();
  }

  sb.channel("shopping_items_changes")
    .on("postgres_changes",{event:"*",schema:"public",table:"shopping_items"},load)
    .subscribe();
  load();

  async function addItem(){
    const v=$("shopInput").value.trim();
    if(!v)return;
    $("shopInput").value="";
    const {error}=await sb.from("shopping_items").insert({name:v,done:false,added_by:myName()});
    if(error)alert("Nie udało się dodać: "+error.message);
    load();
  }
  $("shopAdd").onclick=addItem;
  $("shopInput").addEventListener("keydown",e=>{if(e.key==="Enter")addItem()});
  $("shopClear").onclick=async()=>{
    const done=items.filter(i=>i.done);
    if(!done.length)return;
    if(!confirm("Usunąć "+done.length+" odhaczonych pozycji?"))return;
    const {error}=await sb.from("shopping_items").delete().in("id",done.map(d=>d.id));
    if(error)alert("Nie udało się usunąć: "+error.message);
    load();
  };

  // --- Kalendarz ---
  let calItems=[];

  function daysUntil(d){
    const today=new Date();today.setHours(0,0,0,0);
    const target=new Date(d.event_date+"T00:00:00");
    if(d.recurring){
      target.setFullYear(today.getFullYear());
      if(target<today)target.setFullYear(today.getFullYear()+1);
    }
    return Math.round((target-today)/86400000);
  }
  function fmtWhen(n){
    if(n===0)return"Dziś!";
    if(n===1)return"Jutro";
    if(n>0)return"za "+n+" dni";
    return"było "+Math.abs(n)+" dni temu";
  }

  function renderCal(){
    const list=$("calList");list.replaceChildren();
    $("calEmpty").style.display=calItems.length?"none":"block";
    const withDays=calItems.map(d=>({...d,_days:daysUntil(d)}))
      .sort((a,b)=>{
        if(a._days<0&&b._days>=0)return 1;
        if(b._days<0&&a._days>=0)return-1;
        return a._days-b._days;
      });
    for(const d of withDays){
      const li=document.createElement("li");
      if(d._days>=0&&d._days<=7)li.classList.add("soonrow");
      const txt=document.createElement("div");txt.className="txt";
      const nm=document.createElement("div");nm.className="name";nm.textContent=d.label;
      const when=document.createElement("div");when.className="when";
      when.textContent=new Date(d.event_date+"T00:00:00").toLocaleDateString("pl-PL",{day:"numeric",month:"long"})+(d.recurring?" (co roku)":"");
      txt.append(nm,when);
      const badge=document.createElement("span");
      if(d._days===0){badge.className="badge today";badge.textContent="Dziś!"}
      else if(d._days>0&&d._days<=7){badge.className="badge";badge.textContent=fmtWhen(d._days)}
      else{badge.className="when";badge.textContent=fmtWhen(d._days)}
      const del=document.createElement("button");del.className="del";del.textContent="✕";
      del.onclick=async()=>{
        const {error}=await sb.from("important_dates").delete().eq("id",d.id);
        if(error)alert("Nie udało się usunąć: "+error.message);
        loadCal();
      };
      li.append(txt,badge,del);list.append(li);
    }
  }

  async function loadCal(){
    const {data,error}=await sb.from("important_dates").select("*");
    if(error){alert("Błąd kalendarza: "+error.message);return}
    calItems=data;renderCal();
  }

  sb.channel("important_dates_changes")
    .on("postgres_changes",{event:"*",schema:"public",table:"important_dates"},loadCal)
    .subscribe();
  loadCal();

  $("calAdd").onclick=async()=>{
    const label=$("calLabel").value.trim();
    const date=$("calDate").value;
    if(!label||!date){alert("Podaj nazwę i datę.");return}
    const recurring=$("calRecurring").checked;
    const {error}=await sb.from("important_dates").insert({label,event_date:date,recurring,added_by:myName()});
    if(error)alert("Nie udało się dodać: "+error.message);
    $("calLabel").value="";$("calDate").value="";
    loadCal();
  };

  // --- Do obejrzenia ---
  let watchItems=[];
  let watchTimer=null;
  const tmdbReady=TMDB_API_KEY&&!TMDB_API_KEY.includes("TWOJ-KLUCZ");

  async function tmdbSearch(q){
    const url="https://api.themoviedb.org/3/search/multi?api_key="+encodeURIComponent(TMDB_API_KEY)+"&query="+encodeURIComponent(q)+"&language=pl-PL&include_adult=false";
    try{
      const r=await fetch(url);
      if(!r.ok)return[];
      const j=await r.json();
      return(j.results||[]).filter(x=>x.media_type==="movie"||x.media_type==="tv").slice(0,6);
    }catch(e){return[]}
  }

  function sugRow(item){
    const row=document.createElement("div");row.className="sug-item";
    const img=document.createElement("img");
    if(item.poster_path){img.src="https://image.tmdb.org/t/p/w92"+item.poster_path}else{img.style.visibility="hidden"}
    const box=document.createElement("div");
    const t=document.createElement("div");t.textContent=item.title||item.name||"";
    const date=(item.release_date||item.first_air_date||"").slice(0,4);
    const y=document.createElement("div");y.className="y";y.textContent=(item.media_type==="tv"?"serial":"film")+(date?" · "+date:"");
    box.append(t,y);row.append(img,box);
    row.onclick=()=>addWatch(item);
    return row;
  }

  $("watchInput").addEventListener("input",()=>{
    clearTimeout(watchTimer);
    const q=$("watchInput").value.trim();
    const sug=$("watchSug");
    if(!tmdbReady||!q){sug.classList.remove("show");sug.replaceChildren();return}
    watchTimer=setTimeout(async()=>{
      const res=await tmdbSearch(q);
      sug.replaceChildren();
      if(!res.length){sug.classList.remove("show");return}
      res.forEach(it=>sug.append(sugRow(it)));
      sug.classList.add("show");
    },400);
  });
  $("watchInput").addEventListener("keydown",e=>{
    if(e.key==="Enter"){
      e.preventDefault();
      const v=$("watchInput").value.trim();
      if(v)addWatch({title:v});
    }
  });
  document.addEventListener("click",e=>{
    if(!$("p-watch").contains(e.target))$("watchSug").classList.remove("show");
  });

  async function addWatch(item){
    const title=item.title||item.name||"";
    if(!title)return;
    $("watchInput").value="";
    $("watchSug").classList.remove("show");$("watchSug").replaceChildren();
    const date=(item.release_date||item.first_air_date||"").slice(0,4);
    const{error}=await sb.from("watchlist").insert({
      title,media_type:item.media_type||null,year:date||null,
      poster_path:item.poster_path||null,tmdb_id:item.id||null,
      done:false,added_by:myName()
    });
    if(error)alert("Nie udało się dodać: "+error.message);
    loadWatch();
  }

  function renderWatch(){
    const grid=$("watchGrid");grid.replaceChildren();
    $("watchEmpty").style.display=watchItems.length?"none":"block";
    const sorted=[...watchItems].sort((a,b)=>(a.done===b.done)?0:(a.done?1:-1));
    for(const d of sorted){
      const card=document.createElement("div");card.className="wcard"+(d.done?" done":"");
      if(d.poster_path){
        const img=document.createElement("img");img.src="https://image.tmdb.org/t/p/w342"+d.poster_path;img.alt=d.title;
        card.append(img);
      }else{
        const ph=document.createElement("div");ph.className="ph";ph.textContent="🎬";
        card.append(ph);
      }
      const t=document.createElement("div");t.className="wt";t.textContent=d.title;
      const y=document.createElement("div");y.className="wy";
      y.textContent=[d.media_type==="tv"?"serial":d.media_type==="movie"?"film":"",d.year].filter(Boolean).join(" · ");
      const btns=document.createElement("div");btns.className="wbtns";
      const toggle=document.createElement("button");toggle.textContent=d.done?"Cofnij":"Obejrzane";
      toggle.onclick=async()=>{const{error}=await sb.from("watchlist").update({done:!d.done}).eq("id",d.id);if(error)alert("Błąd: "+error.message);loadWatch()};
      const del=document.createElement("button");del.className="del";del.textContent="✕";
      del.onclick=async()=>{const{error}=await sb.from("watchlist").delete().eq("id",d.id);if(error)alert("Nie udało się usunąć: "+error.message);loadWatch()};
      btns.append(toggle,del);
      card.append(t,y,btns);grid.append(card);
    }
  }

  async function loadWatch(){
    const{data,error}=await sb.from("watchlist").select("*").order("created_at",{ascending:false});
    if(error){alert("Błąd listy do obejrzenia: "+error.message);return}
    watchItems=data;renderWatch();
  }

  sb.channel("watchlist_changes")
    .on("postgres_changes",{event:"*",schema:"public",table:"watchlist"},loadWatch)
    .subscribe();
  loadWatch();
}
</script>
</body></html>
