<!doctype html>
<html lang="pl"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Nasz dom</title>
<style>
:root{--bg:#f6f7f9;--fg:#1b1f24;--mut:#6b7280;--card:#fff;--line:#e5e7eb;--acc:#2563eb;--done:#9ca3af;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#14161a;--fg:#e8eaed;--mut:#9aa0a6;--card:#1d2025;--line:#2b2f36;--acc:#60a5fa;--done:#5b5f66;color-scheme:dark}}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:15px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
main{max-width:560px;margin:0 auto;padding:16px}
h1{font-size:22px;margin:0 0 12px}
.tabs{display:flex;gap:6px;margin-bottom:14px}
.tab{flex:1;padding:9px;border-radius:9px;border:1px solid var(--line);background:var(--card);color:var(--fg);font:inherit;cursor:pointer;text-align:center}
.tab.active{background:var(--acc);color:#fff;border-color:var(--acc)}
.panel{display:none}.panel.active{display:block}
.row{display:flex;gap:8px;margin-bottom:12px}
input[type=text]{flex:1;font:inherit;padding:10px 12px;border-radius:9px;border:1px solid var(--line);background:var(--card);color:var(--fg)}
button.add{font:inherit;padding:10px 16px;border-radius:9px;border:none;background:var(--acc);color:#fff;cursor:pointer}
ul{list-style:none;margin:0;padding:0;background:var(--card);border:1px solid var(--line);border-radius:10px;overflow:hidden}
li{display:flex;align-items:center;gap:10px;padding:10px 12px;border-bottom:1px solid var(--line)}
li:last-child{border-bottom:0}
li input[type=checkbox]{width:19px;height:19px;flex-shrink:0}
.txt{flex:1;min-width:0}
.name{word-break:break-word}
.done .name{text-decoration:line-through;color:var(--done)}
.by{font-size:12px;color:var(--mut)}
.del{border:none;background:none;color:var(--mut);cursor:pointer;font-size:18px;padding:2px 6px}
.del:hover{color:#dc2626}
.empty{color:var(--mut);text-align:center;padding:20px;font-size:14px}
.foot{display:flex;justify-content:space-between;align-items:center;margin-top:10px;font-size:13px;color:var(--mut)}
.foot button{font:inherit;background:none;border:none;color:var(--acc);cursor:pointer;padding:0}
.soon{background:var(--card);border:1px dashed var(--line);border-radius:10px;padding:30px 16px;text-align:center;color:var(--mut)}
.soon b{display:block;color:var(--fg);font-size:17px;margin-bottom:4px}
#err{color:#dc2626;text-align:center;padding:14px;display:none}
.when{font-size:12px;color:var(--mut)}
input[type=date]{font:inherit;padding:10px 12px;border-radius:9px;border:1px solid var(--line);background:var(--card);color:var(--fg)}
.recur{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--mut);white-space:nowrap}
.badge{font-size:11px;font-weight:600;padding:2px 8px;border-radius:999px;background:var(--acc);color:#fff;white-space:nowrap}
.badge.today{background:#dc2626}
li.soonrow{background:color-mix(in srgb, var(--acc) 10%, var(--card))}
.sug{position:absolute;top:100%;left:0;right:0;background:var(--card);border:1px solid var(--line);border-radius:9px;margin-top:4px;max-height:280px;overflow-y:auto;z-index:5;display:none;box-shadow:0 8px 20px rgba(0,0,0,.15)}
.sug.show{display:block}
.sug-item{display:flex;gap:8px;align-items:center;padding:7px 10px;cursor:pointer}
.sug-item:hover{background:var(--bg)}
.sug-item img{width:32px;height:48px;object-fit:cover;border-radius:4px;background:var(--line);flex-shrink:0}
.sug-item .y{color:var(--mut);font-size:12px}
.wgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:12px}
.wcard{background:var(--card);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.wcard img{width:100%;aspect-ratio:2/3;object-fit:cover;display:block;background:var(--line)}
.wcard .ph{width:100%;aspect-ratio:2/3;display:flex;align-items:center;justify-content:center;background:var(--line);color:var(--mut);font-size:30px}
.wcard .wt{padding:6px 8px 0;font-size:13px;word-break:break-word}
.wcard .wy{padding:0 8px 6px;font-size:11px;color:var(--mut)}
.wcard.done{opacity:.55}
.wcard.done .wt{text-decoration:line-through}
.wbtns{display:flex;justify-content:space-between;gap:4px;padding:0 6px 6px}
.wbtns button{font:inherit;font-size:11px;padding:3px 6px;border-radius:6px;border:1px solid var(--line);background:var(--card);color:var(--fg);cursor:pointer}
.wbtns button.del{color:#dc2626}
</style></head>
<body><main>
<h1>🏡 Nasz dom</h1>
<div class="tabs">
 <button class="tab active" data-p="shop">Zakupy</button>
 <button class="tab" data-p="watch">Do obejrzenia</button>
 <button class="tab" data-p="cal">Kalendarz</button>
</div>
<div id="err"></div>
<div class="panel active" id="p-shop">
 <div class="row"><input id="shopInput" type="text" placeholder="np. mleko, chleb…" maxlength="80"><button class="add" id="shopAdd">Dodaj</button></div>
 <ul id="shopList"></ul>
 <div class="empty" id="shopEmpty" style="display:none">Lista jest pusta — dodaj coś powyżej.</div>
 <div class="foot"><span id="shopCount"></span><button id="shopClear">Wyczyść odhaczone</button></div>
</div>
<div class="panel" id="p-watch">
 <div class="row" style="position:relative">
  <input id="watchInput" type="text" placeholder="Wpisz tytuł filmu lub serialu…" maxlength="100" autocomplete="off">
  <div class="sug" id="watchSug"></div>
 </div>
 <div class="wgrid" id="watchGrid"></div>
 <div class="empty" id="watchEmpty" style="display:none">Lista jest pusta — zacznij wpisywać tytuł powyżej.</div>
</div>
<div class="panel" id="p-cal">
 <div class="row"><input id="calLabel" type="text" placeholder="np. Urodziny Zosi" maxlength="60"></div>
 <div class="row">
  <input id="calDate" type="date">
  <label class="recur"><input id="calRecurring" type="checkbox" checked> co roku</label>
  <button class="add" id="calAdd">Dodaj</button>
 </div>
 <ul id="calList"></ul>
 <div class="empty" id="calEmpty" style="display:none">Brak zapisanych dat — dodaj coś powyżej.</div>
</div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.108.2/dist/umd/supabase.js"></script>
<script>
// --- WKLEJ TU SWOJE DANE Z SUPABASE (Settings -> API Keys) ---
const SUPABASE_URL = "https://eiyuqczdtmuhjkqqqvva.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_dG2dAFFXU9Z_sEy56JDX2w_9aeV1GXE";
const TMDB_API_KEY = "8ffd14e25be9f06ce89a5ce352294c40";
// ------------------------------------------------------------------

const $=id=>document.getElementById(id);
document.querySelectorAll(".tab").forEach(t=>t.onclick=()=>{
  document.querySelectorAll(".tab").forEach(x=>x.classList.toggle("active",x===t));
  document.querySelectorAll(".panel").forEach(p=>p.classList.toggle("active",p.id==="p-"+t.dataset.p));
});

function myName(){
  let n=localStorage.getItem("nd_name");
  if(!n){n=(prompt("Jak Cię zapisać na liście? (imię)")||"Ktoś").trim().slice(0,30);localStorage.setItem("nd_name",n)}
  return n;
}

if(SUPABASE_URL.includes("TWOJ-PROJEKT")){
  $("err").style.display="block";
  $("err").textContent="Uzupełnij SUPABASE_URL i SUPABASE_ANON_KEY na górze pliku index.html.";
}else{
  const sb=supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  let items=[];

  function render(){
    const list=$("shopList");list.replaceChildren();
    $("shopEmpty").style.display=items.length?"none":"block";
    const left=items.filter(i=>!i.done).length;
    $("shopCount").textContent=items.length?(left+" do kupienia z "+items.length):"";
    for(const d of items){
      const li=document.createElement("li");
      if(d.done)li.classList.add("done");
      const cb=document.createElement("input");cb.type="checkbox";cb.checked=!!d.done;
      cb.onchange=async()=>{
        const {error}=await sb.from("shopping_items").update({done:cb.checked}).eq("id",d.id);
        if(error){cb.checked=!cb.checked;alert("Nie udało się zapisać: "+error.message)}
        load();
      };
      const txt=document.createElement("div");txt.className="txt";
      const nm=document.createElement("div");nm.className="name";nm.textContent=d.name||"";
      txt.append(nm);
      if(d.added_by){const by=document.createElement("div");by.className="by";by.textContent="dodał(a): "+d.added_by;txt.append(by)}
      const del=document.createElement("button");del.className="del";del.textContent="✕";
      del.onclick=async()=>{
        const {error}=await sb.from("shopping_items").delete().eq("id",d.id);
        if(error)alert("Nie udało się usunąć: "+error.message);
        load();
      };
      li.append(cb,txt,del);list.append(li);
    }
  }

  async function load(){
    const {data,error}=await sb.from("shopping_items").select("*").order("created_at",{ascending:true});
    if(error){$("err").style.display="block";$("err").textContent="Błąd połączenia z bazą: "+error.message;return}
    $("err").style.display="none";
    items=data;render();
  }

  sb.channel("shopping_items_changes")
    .on("postgres_changes",{event:"*",schema:"public",table:"shopping_items"},load)
    .subscribe();
  load();

  async function addItem(){
    const v=$("shopInput").value.trim();
    if(!v)return;
    $("shopInput").value="";
    const {error}=await sb.from("shopping_items").insert({name:v,done:false,added_by:myName()});
    if(error)alert("Nie udało się dodać: "+error.message);
    load();
  }
  $("shopAdd").onclick=addItem;
  $("shopInput").addEventListener("keydown",e=>{if(e.key==="Enter")addItem()});
  $("shopClear").onclick=async()=>{
    const done=items.filter(i=>i.done);
    if(!done.length)return;
    if(!confirm("Usunąć "+done.length+" odhaczonych pozycji?"))return;
    const {error}=await sb.from("shopping_items").delete().in("id",done.map(d=>d.id));
    if(error)alert("Nie udało się usunąć: "+error.message);
    load();
  };

  // --- Kalendarz ---
  let calItems=[];

  function daysUntil(d){
    const today=new Date();today.setHours(0,0,0,0);
    const target=new Date(d.event_date+"T00:00:00");
    if(d.recurring){
      target.setFullYear(today.getFullYear());
      if(target<today)target.setFullYear(today.getFullYear()+1);
    }
    return Math.round((target-today)/86400000);
  }
  function fmtWhen(n){
    if(n===0)return"Dziś!";
    if(n===1)return"Jutro";
    if(n>0)return"za "+n+" dni";
    return"było "+Math.abs(n)+" dni temu";
  }

  function renderCal(){
    const list=$("calList");list.replaceChildren();
    $("calEmpty").style.display=calItems.length?"none":"block";
    const withDays=calItems.map(d=>({...d,_days:daysUntil(d)}))
      .sort((a,b)=>{
        if(a._days<0&&b._days>=0)return 1;
        if(b._days<0&&a._days>=0)return-1;
        return a._days-b._days;
      });
    for(const d of withDays){
      const li=document.createElement("li");
      if(d._days>=0&&d._days<=7)li.classList.add("soonrow");
      const txt=document.createElement("div");txt.className="txt";
      const nm=document.createElement("div");nm.className="name";nm.textContent=d.label;
      const when=document.createElement("div");when.className="when";
      when.textContent=new Date(d.event_date+"T00:00:00").toLocaleDateString("pl-PL",{day:"numeric",month:"long"})+(d.recurring?" (co roku)":"");
      txt.append(nm,when);
      const badge=document.createElement("span");
      if(d._days===0){badge.className="badge today";badge.textContent="Dziś!"}
      else if(d._days>0&&d._days<=7){badge.className="badge";badge.textContent=fmtWhen(d._days)}
      else{badge.className="when";badge.textContent=fmtWhen(d._days)}
      const del=document.createElement("button");del.className="del";del.textContent="✕";
      del.onclick=async()=>{
        const {error}=await sb.from("important_dates").delete().eq("id",d.id);
        if(error)alert("Nie udało się usunąć: "+error.message);
        loadCal();
      };
      li.append(txt,badge,del);list.append(li);
    }
  }

  async function loadCal(){
    const {data,error}=await sb.from("important_dates").select("*");
    if(error){alert("Błąd kalendarza: "+error.message);return}
    calItems=data;renderCal();
  }

  sb.channel("important_dates_changes")
    .on("postgres_changes",{event:"*",schema:"public",table:"important_dates"},loadCal)
    .subscribe();
  loadCal();

  $("calAdd").onclick=async()=>{
    const label=$("calLabel").value.trim();
    const date=$("calDate").value;
    if(!label||!date){alert("Podaj nazwę i datę.");return}
    const recurring=$("calRecurring").checked;
    const {error}=await sb.from("important_dates").insert({label,event_date:date,recurring,added_by:myName()});
    if(error)alert("Nie udało się dodać: "+error.message);
    $("calLabel").value="";$("calDate").value="";
    loadCal();
  };

  // --- Do obejrzenia ---
  let watchItems=[];
  let watchTimer=null;
  const tmdbReady=TMDB_API_KEY&&!TMDB_API_KEY.includes("TWOJ-KLUCZ");

  async function tmdbSearch(q){
    const url="https://api.themoviedb.org/3/search/multi?api_key="+encodeURIComponent(TMDB_API_KEY)+"&query="+encodeURIComponent(q)+"&language=pl-PL&include_adult=false";
    try{
      const r=await fetch(url);
      if(!r.ok)return[];
      const j=await r.json();
      return(j.results||[]).filter(x=>x.media_type==="movie"||x.media_type==="tv").slice(0,6);
    }catch(e){return[]}
  }

  function sugRow(item){
    const row=document.createElement("div");row.className="sug-item";
    const img=document.createElement("img");
    if(item.poster_path){img.src="https://image.tmdb.org/t/p/w92"+item.poster_path}else{img.style.visibility="hidden"}
    const box=document.createElement("div");
    const t=document.createElement("div");t.textContent=item.title||item.name||"";
    const date=(item.release_date||item.first_air_date||"").slice(0,4);
    const y=document.createElement("div");y.className="y";y.textContent=(item.media_type==="tv"?"serial":"film")+(date?" · "+date:"");
    box.append(t,y);row.append(img,box);
    row.onclick=()=>addWatch(item);
    return row;
  }

  $("watchInput").addEventListener("input",()=>{
    clearTimeout(watchTimer);
    const q=$("watchInput").value.trim();
    const sug=$("watchSug");
    if(!tmdbReady||!q){sug.classList.remove("show");sug.replaceChildren();return}
    watchTimer=setTimeout(async()=>{
      const res=await tmdbSearch(q);
      sug.replaceChildren();
      if(!res.length){sug.classList.remove("show");return}
      res.forEach(it=>sug.append(sugRow(it)));
      sug.classList.add("show");
    },400);
  });
  $("watchInput").addEventListener("keydown",e=>{
    if(e.key==="Enter"){
      e.preventDefault();
      const v=$("watchInput").value.trim();
      if(v)addWatch({title:v});
    }
  });
  document.addEventListener("click",e=>{
    if(!$("p-watch").contains(e.target))$("watchSug").classList.remove("show");
  });

  async function addWatch(item){
    const title=item.title||item.name||"";
    if(!title)return;
    $("watchInput").value="";
    $("watchSug").classList.remove("show");$("watchSug").replaceChildren();
    const date=(item.release_date||item.first_air_date||"").slice(0,4);
    const{error}=await sb.from("watchlist").insert({
      title,media_type:item.media_type||null,year:date||null,
      poster_path:item.poster_path||null,tmdb_id:item.id||null,
      done:false,added_by:myName()
    });
    if(error)alert("Nie udało się dodać: "+error.message);
    loadWatch();
  }

  function renderWatch(){
    const grid=$("watchGrid");grid.replaceChildren();
    $("watchEmpty").style.display=watchItems.length?"none":"block";
    const sorted=[...watchItems].sort((a,b)=>(a.done===b.done)?0:(a.done?1:-1));
    for(const d of sorted){
      const card=document.createElement("div");card.className="wcard"+(d.done?" done":"");
      if(d.poster_path){
        const img=document.createElement("img");img.src="https://image.tmdb.org/t/p/w342"+d.poster_path;img.alt=d.title;
        card.append(img);
      }else{
        const ph=document.createElement("div");ph.className="ph";ph.textContent="🎬";
        card.append(ph);
      }
      const t=document.createElement("div");t.className="wt";t.textContent=d.title;
      const y=document.createElement("div");y.className="wy";
      y.textContent=[d.media_type==="tv"?"serial":d.media_type==="movie"?"film":"",d.year].filter(Boolean).join(" · ");
      const btns=document.createElement("div");btns.className="wbtns";
      const toggle=document.createElement("button");toggle.textContent=d.done?"Cofnij":"Obejrzane";
      toggle.onclick=async()=>{const{error}=await sb.from("watchlist").update({done:!d.done}).eq("id",d.id);if(error)alert("Błąd: "+error.message);loadWatch()};
      const del=document.createElement("button");del.className="del";del.textContent="✕";
      del.onclick=async()=>{const{error}=await sb.from("watchlist").delete().eq("id",d.id);if(error)alert("Nie udało się usunąć: "+error.message);loadWatch()};
      btns.append(toggle,del);
      card.append(t,y,btns);grid.append(card);
    }
  }

  async function loadWatch(){
    const{data,error}=await sb.from("watchlist").select("*").order("created_at",{ascending:false});
    if(error){alert("Błąd listy do obejrzenia: "+error.message);return}
    watchItems=data;renderWatch();
  }

  sb.channel("watchlist_changes")
    .on("postgres_changes",{event:"*",schema:"public",table:"watchlist"},loadWatch)
    .subscribe();
  loadWatch();
}
</script>
</body></html>
